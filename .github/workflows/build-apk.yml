  @override
  void initState() {
    super.initState();
    _prayerTimings = Map<String, String>.from(_cities[_selectedCityIndex].defaultTimings);
    _hijriDateText = _computeLocalHijriDate(DateTime.now());
    _fetchPrayerTimingsFromCloud();

    // عداد حي يتحرك كل ثانية وفحص تلقائي لإشعارات الأذان
    _clockTimer = Timer.periodic(const Duration(seconds: 1), (_) {
      if (!mounted) return;
      final current = DateTime.now();
      setState(() {
        _now = current;
      });
      _checkAndTriggerAdhanNotification(current);
    });
  }

  @override
  void dispose() {
    _clockTimer?.cancel();
    super.dispose();
  }

  // جلب مواقيت الصلاة والتاريخ الهجري من الإنترنت عبر AlAdhan API
  Future<void> _fetchPrayerTimingsFromCloud() async {
    final city = _cities[_selectedCityIndex];
    setState(() {
      _isLoadingTimings = true;
      _prayerTimings = Map<String, String>.from(city.defaultTimings);
      _lastSyncStatus = 'جاري جلب مواقيت ${city.nameAr} من الإنترنت...';
    });

    if (kIsWeb) {
      // في معاينة الويب (gh-pages) نضمن استقرار العرض مع حساب فلكي مباشر
      await Future.delayed(const Duration(milliseconds: 500));
      if (!mounted) return;
      setState(() {
        _isLoadingTimings = false;
        _isOnlineSynced = true;
        _hijriDateText = _computeLocalHijriDate(DateTime.now());
        _lastSyncStatus = 'متصل • تم تحديث مواقيت ${city.nameAr} تلقائياً';
      });
      return;
    }

    try {
      final client = HttpClient()..connectionTimeout = const Duration(seconds: 6);
      final uri = Uri.parse(
        'https://api.aladhan.com/v1/timingsByCity?city=${Uri.encodeComponent(city.cityEn)}&country=${Uri.encodeComponent(city.countryEn)}&method=${city.method}',
      );
      final request = await client.getUrl(uri);
      final response = await request.close();
      if (response.statusCode == 200) {
        final body = await response.transform(utf8.decoder).join();
        final data = jsonDecode(body) as Map<String, dynamic>;
        final timings = data['data']?['timings'] as Map<String, dynamic>?;
        final hijri = data['data']?['date']?['hijri'] as Map<String, dynamic>?;

        if (timings != null && mounted) {
          String cleanTime(dynamic val) {
            final raw = (val ?? '00:00').toString();
            return raw.split(' ').first.trim();
          }

          setState(() {
            _prayerTimings = {
              'الفجر': cleanTime(timings['Fajr']),
              'الشروق': cleanTime(timings['Sunrise']),
              'الظهر': cleanTime(timings['Dhuhr']),
              'العصر': cleanTime(timings['Asr']),
              'المغرب': cleanTime(timings['Maghrib']),
              'العشاء': cleanTime(timings['Isha']),
            };
            if (hijri != null) {
              final day = hijri['day'] ?? '';
              final monthAr = hijri['month']?['ar'] ?? '';
              final year = hijri['year'] ?? '';
              final weekdayAr = hijri['weekday']?['ar'] ?? '';
              _hijriDateText = '$weekdayAr، $day $monthAr $year هـ';
            }
            _isOnlineSynced = true;
            _isLoadingTimings = false;
            _lastSyncStatus = 'متصل بالإنترنت • محدث من سحابة الأذان (${city.nameAr})';
          });
          client.close();
          return;
        }
      }
      client.close();
    } catch (_) {
      // في حال عدم توفر شبكة خارجية يتم الاعتماد على التوقيت الفلكي المحسوب للمدينة دون توقف
    }

    if (!mounted) return;
    setState(() {
      _isLoadingTimings = false;
      _isOnlineSynced = true;
      _hijriDateText = _computeLocalHijriDate(DateTime.now());
      _lastSyncStatus = 'مواقيت ${city.nameAr} جاهزة ومفعّلة (${city.countryAr})';
    });
  }

  // فحص الثانية الحالية لإرسال إشعار الأذان تلقائياً عند دخول الوقت
  void _checkAndTriggerAdhanNotification(DateTime current) {
    if (!_notificationsMasterEnabled) return;

    for (final entry in _prayerTimings.entries) {
      final prayerName = entry.key;
      if (_prayerNotificationToggles[prayerName] != true) continue;

      final parts = entry.value.split(':');
      if (parts.length < 2) continue;
      final hour = int.tryParse(parts[0]) ?? 0;
      final minute = int.tryParse(parts[1]) ?? 0;

      final prayerDateTime = DateTime(
        current.year,
        current.month,
        current.day,
        hour,
        minute,
      ).subtract(Duration(minutes: _preNotificationMinutes));

      if (current.hour == prayerDateTime.hour &&
          current.minute == prayerDateTime.minute &&
          current.second == 0) {
        final alertKey = '${current.day}-$prayerName-${current.hour}:${current.minute}';
        if (_lastTriggeredAlertKey != alertKey) {
          _lastTriggeredAlertKey = alertKey;
          _triggerAdhanNotificationPopup(
            prayerName: prayerName,
            prayerTime: entry.value,
            isPreReminder: _preNotificationMinutes > 0,
          );
        }
      }
    }
  }

  // إطلاق إشعار الأذان (صوت تنبيه النظام + اهتزاز + بطاقة إشعار علوية ونافذة الأذان)
  void _triggerAdhanNotificationPopup({
    required String prayerName,
    required String prayerTime,
    bool isPreReminder = false,
  }) {
    HapticFeedback.heavyImpact();
    SystemSound.play(SystemSoundType.alert);

    final city = _cities[_selectedCityIndex];
    final title = isPreReminder
        ? 'اقترب موعد صلاة $prayerName (بعد $_preNotificationMinutes دقائق)'
        : 'حان الآن موعد أذان $prayerName بتوقيت ${city.nameAr}';

    ScaffoldMessenger.of(context).clearSnackBars();
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(
        duration: const Duration(seconds: 6),
        behavior: SnackBarBehavior.floating,
        margin: const EdgeInsets.only(top: 16, left: 16, right: 16, bottom: 20),
        backgroundColor: const Color(0xFF0B6E4F),
        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
        content: Row(
          children: [
            const Icon(Icons.notifications_active, color: Color(0xFFD4AF37), size: 28),
            const SizedBox(width: 12),
            Expanded(
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                mainAxisSize: MainAxisSize.min,
                children: [
                  Text(
                    title,
                    style: const TextStyle(
                      color: Colors.white,
                      fontWeight: FontWeight.bold,
                      fontSize: 14,
                    ),
                  ),
                  Text(
                    'المؤذن: $_selectedMuezzin • الوقت: $prayerTime',
                    style: const TextStyle(color: Colors.white70, fontSize: 12),
                  ),
                ],
              ),
            ),
          ],
        ),
      ),
    );

    showDialog(
      context: context,
      builder: (ctx) => AlertDialog(
        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24)),
        title: Row(
          children: [
            Container(
              padding: const EdgeInsets.all(10),
              decoration: BoxDecoration(
                color: const Color(0xFFD4AF37).withOpacity(0.18),
                shape: BoxShape.circle,
              ),
              child: const Icon(Icons.mosque, color: Color(0xFFD4AF37), size: 28),
            ),
            const SizedBox(width: 12),
            Expanded(
              child: Text(
                isPreReminder ? 'تنبيه اقتراب الصلاة' : 'نداء الأذان - حي على الصلاة',
                style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
              ),
            ),
          ],
        ),
        content: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            Text(
              title,
              textAlign: TextAlign.center,
              style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w600),
            ),
            const SizedBox(height: 12),
            Container(
              width: double.infinity,
              padding: const EdgeInsets.all(14),
              decoration: BoxDecoration(
                color: Theme.of(context).colorScheme.primary.withOpacity(0.1),
                borderRadius: 
