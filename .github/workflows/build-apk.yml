// ============================================================================
class CityModel {
  final String nameAr;
  final String countryAr;
  final String cityEn;
  final String countryEn;
  final double lat;
  final double lng;
  final int method; // طريقة الحساب في API الأذان
  final Map<String, String> defaultTimings;

  const CityModel({
    required this.nameAr,
    required this.countryAr,
    required this.cityEn,
    required this.countryEn,
    required this.lat,
    required this.lng,
    this.method = 4,
    required this.defaultTimings,
  });
}

class SurahInfo {
  final int number;
  final String name;
  final String englishName;
  final int versesCount;
  final String revelationType; // مكية / مدنية

  const SurahInfo({
    required this.number,
    required this.name,
    required this.englishName,
    required this.versesCount,
    required this.revelationType,
  });
}

class DhikrItem {
  final String category;
  final String text;
  final String reward;
  final int targetCount;
  int currentCount;

  DhikrItem({
    required this.category,
    required this.text,
    required this.reward,
    required this.targetCount,
  }) : currentCount = targetCount;
}

class AllahNameItem {
  final int id;
  final String name;
  final String meaning;

  const AllahNameItem({
    required this.id,
    required this.name,
    required this.meaning,
  });
}

